<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TikPoc Event Bridge</title>
    <style>
      body { box-sizing: border-box; width: 260px; margin: 0; padding: 18px; color: #17191c; font-family: "Avenir Next", "PingFang SC", sans-serif; letter-spacing: 0; }
      h1 { margin: 0 0 14px; font-size: 16px; }
      dl { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; margin: 0 0 16px; font-size: 12px; }
      dt { color: #6b727b; }
      dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
      button { width: 100%; min-height: 36px; border: 1px solid #d62950; border-radius: 6px; background: #d62950; color: #fff; font-weight: 700; cursor: pointer; }
      .state { color: #126b4b; }
      .state.off { color: #9b2435; }
    </style>
  </head>
  <body>
    <h1>TikPoc Event Bridge</h1>
    <dl>
      <dt>状态</dt><dd id="state" class="state off">未启用</dd>
      <dt>绑定方式</dt><dd id="binding-mode">自动识别</dd>
      <dt>Profile</dt><dd id="profile">-</dd>
      <dt>账号</dt><dd id="account">-</dd>
      <dt>设备</dt><dd id="device">-</dd>
      <dt>预期用户</dt><dd id="expected">-</dd>
      <dt>页面用户</dt><dd id="observed">-</dd>
      <dt>绑定状态</dt><dd id="binding-state" class="state off">未验证</dd>
      <dt>连接识别</dt><dd id="auto-connect-state">等待页面</dd>
      <dt>自动回关</dt><dd id="followback">-</dd>
      <dt>私信回复</dt><dd id="dm">-</dd>
      <dt>连接测试</dt><dd id="connection">未测试</dd>
    </dl>
    <button id="open-options" type="button">打开设置</button>
    <script src="options-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
