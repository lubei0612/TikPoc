[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tikpoc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Appium-Python-Client>=5,<6",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[project.scripts]
tikpoc = "tikpoc.cli:main"

[tool.setuptools.package-data]
tikpoc = ["static/*", "static/console/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
